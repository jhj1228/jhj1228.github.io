<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 핸드폰 컬렉션 관리</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>내 핸드폰 컬렉션</h1>
            <p>소유 중인 핸드폰 목록을 확인하고 관리하세요.</p>
        </div>
    </header>

    <main class="container">
        <section class="stats-section">
            <div class="stat-card">
                <h3>전체 기기</h3>
                <span id="total-count">0</span>
            </div>
            <div class="stat-card">
                <h3>사용 중</h3>
                <span id="active-count">0</span>
            </div>
            <div class="stat-card">
                <h3>보관 중</h3>
                <span id="stored-count">0</span>
            </div>
        </section>
        <section class="filter-section">
            <input type="text" id="search-input" placeholder="기기명, 제조사, 메모 검색...">
            <select id="brand-filter">
                <option value="all">모든 제조사</option>
                <option value="삼성">삼성</option>
                <option value="Apple">Apple</option>
                <option value="LG">LG</option>
                <option value="기타">기타</option>
            </select>
            <select id="status-filter">
                <option value="all">모든 상태</option>
                <option value="사용 중">사용 중</option>
                <option value="보관 중">보관 중</option>
                <option value="처분 완료">처분 완료</option>
            </select>
        </section>
        <section id="phone-list-container" class="phone-grid">
        </section>
    </main>
    <script src="index.js" defer></script>
</body>
</html>
